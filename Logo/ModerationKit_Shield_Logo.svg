<svg width="100%" viewBox="0 0 680 400" role="img" style="" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">ModerationKit shield logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">3D gamish shield with vibrant colors and glowing checkmark</desc>
  
  <defs>
    <linearGradient id="shieldGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FF4500;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CC2200;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="shieldLeft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0"/>
    </linearGradient>
    
    <linearGradient id="shieldRight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0"/>
    </linearGradient>
    
    <linearGradient id="checkGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00CC00;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadowFilter">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 3D Shield Back Layer (Dark shadow) -->
  <path d="M 340 80 L 260 130 L 260 200 Q 260 280 340 330 Q 420 280 420 200 L 420 130 Z" fill="#1a1a2e" opacity="0.3" transform="translate(8, 8)" style="fill:rgb(26, 26, 46);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Main Shield - Front Face (Gradient) -->
  <path d="M 340 80 L 260 130 L 260 200 Q 260 280 340 330 Q 420 280 420 200 L 420 130 Z" fill="url(#shieldGradient)" filter="url(#shadowFilter)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Shield Left Edge (3D Effect) -->
  <path d="M 260 130 L 260 200 Q 260 280 340 330 L 330 325 Q 250 275 250 200 L 250 125 Z" fill="url(#shieldLeft)" opacity="0.8" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Shield Right Edge (Highlight) -->
  <path d="M 420 130 L 420 200 Q 420 280 340 330 L 345 335 Q 430 285 430 200 L 430 125 Z" fill="url(#shieldRight)" opacity="0.6" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Top Shine -->
  <ellipse cx="340" cy="105" rx="55" ry="18" fill="#FFFFFF" opacity="0.25" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.25;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Inner Glow Circle -->
  <circle cx="340" cy="210" r="65" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5" filter="url(#glow)" style="fill:none;stroke:rgb(255, 215, 0);color:rgb(0, 0, 0);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Checkmark - Left line -->
  <line x1="310" y1="210" x2="330" y2="230" stroke="url(#checkGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" style="fill:rgb(0, 0, 0);color:rgb(0, 0, 0);stroke-width:6px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Checkmark - Right line -->
  <line x1="330" y1="230" x2="375" y2="180" stroke="url(#checkGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" style="fill:rgb(0, 0, 0);color:rgb(0, 0, 0);stroke-width:6px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Checkmark Outline Glow (green aura) -->
  <line x1="310" y1="210" x2="330" y2="230" stroke="#00FF00" stroke-width="8" stroke-linecap="round" opacity="0.3" filter="url(#glow)" style="fill:rgb(0, 0, 0);stroke:rgb(0, 255, 0);color:rgb(0, 0, 0);stroke-width:8px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="330" y1="230" x2="375" y2="180" stroke="#00FF00" stroke-width="8" stroke-linecap="round" opacity="0.3" filter="url(#glow)" style="fill:rgb(0, 0, 0);stroke:rgb(0, 255, 0);color:rgb(0, 0, 0);stroke-width:8px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>